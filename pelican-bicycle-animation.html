<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行记 · SVG 2D 动画</title>
<style>
  :root{
    --ink:#0b0813;
    --cream:#f8edda;
    --cream-dim:#d9c8ac;
    --coral:#e8503a;
    --gold:#f2b463;
    --line:rgba(248,237,218,.22);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Source Han Serif SC",Georgia,serif;
    --mono:"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,3vw,40px);
    background:
      radial-gradient(120% 90% at 50% 0%,#1d1630 0%,#0b0813 62%,#05040a 100%);
    color:var(--cream);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  /* ——— 海报画框 ——— */
  .poster{
    position:relative;
    width:min(1200px,100%);
    max-width:100%;
    min-width:0;
    aspect-ratio:16/9;
    border-radius:20px;
    overflow:hidden;
    background:#12102a;
    box-shadow:
      0 0 0 1px rgba(248,237,218,.12),
      0 2px 4px rgba(0,0,0,.5),
      0 32px 80px -24px rgba(0,0,0,.85),
      0 0 120px -40px rgba(232,80,58,.35);
    isolation:isolate;
  }
  .poster::after{ /* 内阴影 / 暗角 */
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    border-radius:inherit;
    box-shadow:inset 0 0 120px 12px rgba(6,4,12,.55),
               inset 0 0 0 1px rgba(248,237,218,.08);
    z-index:3;
  }
  svg#scene{position:absolute;inset:0;display:block;width:100%;height:100%}

  /* ——— HUD ——— */
  .hud{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto 1fr auto;
    align-items:start;
    padding:clamp(16px,3vw,38px);
    pointer-events:none;
    z-index:4;
  }
  .plate{
    grid-row:1;
    max-width:min(52ch,66%);
    padding-left:clamp(10px,1.2vw,16px);
    border-left:1px solid var(--line);
  }
  .kicker{
    margin:0 0 clamp(6px,.8vw,10px);
    font-family:var(--mono);
    font-size:clamp(8px,.82vw,11px);
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--cream-dim);
    display:flex;align-items:center;gap:.7em;
  }
  .kicker::after{
    content:"";height:1px;flex:1 0 22px;max-width:110px;
    background:linear-gradient(90deg,var(--line),transparent);
  }
  h1{
    margin:0;
    font-size:clamp(22px,3.4vw,46px);
    font-weight:500;
    line-height:1.02;
    letter-spacing:-.01em;
    text-shadow:0 2px 24px rgba(8,5,16,.65);
  }
  h1 em{
    font-style:italic;
    color:var(--gold);
  }
  .en{
    margin:clamp(4px,.6vw,8px) 0 0;
    font-family:var(--mono);
    font-size:clamp(9px,.92vw,13px);
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(248,237,218,.66);
  }
  .en em{
    font-style:italic;
    font-family:var(--serif);
    text-transform:none;
    letter-spacing:.02em;
    font-size:1.5em;
    color:var(--gold);
  }
  .sub{
    margin:clamp(6px,.9vw,12px) 0 0;
    font-family:var(--mono);
    font-size:clamp(8px,.78vw,11px);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(248,237,218,.62);
  }
  .controls{
    grid-row:3;
    justify-self:end;
    align-self:end;
    display:flex;align-items:center;gap:clamp(8px,1vw,14px);
    padding:clamp(7px,.8vw,10px);
    border-radius:999px;
    background:rgba(14,10,26,.42);
    border:1px solid var(--line);
    backdrop-filter:blur(10px) saturate(120%);
    -webkit-backdrop-filter:blur(10px) saturate(120%);
    pointer-events:auto;
    box-shadow:0 10px 30px -14px rgba(0,0,0,.9);
  }
  .btn{
    display:grid;place-items:center;
    width:clamp(30px,2.6vw,38px);height:clamp(30px,2.6vw,38px);
    border-radius:50%;
    border:1px solid rgba(248,237,218,.28);
    background:linear-gradient(180deg,rgba(248,237,218,.14),rgba(248,237,218,.04));
    color:var(--cream);
    cursor:pointer;
    padding:0;
    transition:transform .18s ease,background .18s ease,border-color .18s ease;
  }
  .btn:hover{background:rgba(248,237,218,.2);border-color:rgba(248,237,218,.5)}
  .btn:active{transform:scale(.94)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .btn svg{width:44%;height:44%;fill:currentColor}
  .btn .ico-play{display:none}
  .btn.is-paused .ico-play{display:block}
  .btn.is-paused .ico-pause{display:none}
  .slider{
    display:flex;align-items:center;gap:.6em;
    font-family:var(--mono);
    font-size:clamp(8px,.74vw,10px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(248,237,218,.7);
    padding-right:clamp(6px,.8vw,12px);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:clamp(58px,7vw,96px);height:2px;
    border-radius:2px;background:rgba(248,237,218,.28);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:11px;height:11px;border-radius:50%;
    background:var(--gold);
    border:0;
    box-shadow:0 0 0 3px rgba(242,180,99,.18);
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(242,180,99,.18);
  }
  input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
  output{
    min-width:3.2em;text-align:right;
    color:var(--gold);letter-spacing:.06em;
  }

  /* ——— 装饰性动画（SVG 内的分组） ——— */
  .cloud-drift,.sun-shimmer,.scarf,.palm-sway,.bird-fly,.dust,.streak{
    transform-box:view-box;
    transform-origin:center;
    will-change:transform,opacity;
  }
  .cloud-drift{animation:cloudDrift calc(26s / var(--spd,1)) ease-in-out infinite alternate}
  .sun-shimmer{animation:shimmer calc(5.5s / var(--spd,1)) ease-in-out infinite alternate}
  .scarf{animation:flutter calc(2.4s / var(--spd,1)) ease-in-out infinite alternate}
  .palm-sway{animation:palmSway calc(12s / var(--spd,1)) ease-in-out infinite alternate}
  .bird-fly{animation:glide calc(9s / var(--spd,1)) ease-in-out infinite alternate}
  .dust{animation:puff calc(1.9s / var(--spd,1)) ease-out infinite}
  .streak{animation:dash calc(1.1s / var(--spd,1)) linear infinite}

  @keyframes cloudDrift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  @keyframes shimmer{
    from{opacity:.42;transform:scaleX(.9)}
    to{opacity:.72;transform:scaleX(1.12)}
  }
  @keyframes flutter{
    from{transform:rotate(-4deg) translateY(1px)}
    to{transform:rotate(7deg) translateY(-2px)}
  }
  @keyframes palmSway{
    from{transform:rotate(-1.4deg)}
    to{transform:rotate(1.6deg)}
  }
  @keyframes glide{
    from{transform:translate(-10px,2px)}
    to{transform:translate(14px,-6px)}
  }
  @keyframes puff{
    0%{opacity:.32;transform:translate(0,0) scale(.7)}
    70%{opacity:.12}
    100%{opacity:0;transform:translate(-58px,-8px) scale(1.5)}
  }
  @keyframes dash{
    from{transform:translateX(10px);opacity:.1}
    45%{opacity:.42}
    to{transform:translateX(-34px);opacity:.1}
  }

  @media (max-width:720px){
    .plate{max-width:100%}
    .kicker{display:none}
    .sub{display:none}
    .hud{padding:12px}
    .controls{padding:5px;gap:6px}
    .btn{width:40px;height:40px}
    input[type=range]{width:52px}
    .slider{padding-right:5px;letter-spacing:.1em}
    .en{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .cloud-drift,.sun-shimmer,.scarf,.palm-sway,.bird-fly,.dust,.streak{
      animation:none!important;
    }
  }
</style>
</head>
<body>
<div class="poster">
  <svg id="scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice"
       role="img" aria-labelledby="sceneTitle sceneDesc">
    <title id="sceneTitle">鹈鹕骑行记：一只鹈鹕骑着复古自行车在黄昏的海岸公路上前进</title>
    <desc id="sceneDesc">纯 SVG 绘制的二维动画。画面由渐变天空、落日与海面反光、棕榈剪影、海岸公路和一辆青绿色自行车组成；鹈鹕坐在车座上，双翼扶把，双脚随曲柄踏动踏板，车轮持续旋转，路面的虚线与前景草丛向左滚动。</desc>

    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#121634"/>
        <stop offset="0.22" stop-color="#2b2450"/>
        <stop offset="0.40" stop-color="#573661"/>
        <stop offset="0.55" stop-color="#8d4a62"/>
        <stop offset="0.65" stop-color="#c26a5c"/>
        <stop offset="0.72" stop-color="#eb9861"/>
        <stop offset="0.79" stop-color="#f7c885"/>
        <stop offset="1"   stop-color="#fbdfb0"/>
      </linearGradient>
      <!-- 落日光晕 -->
      <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"   stop-color="#fff6da" stop-opacity="0.95"/>
        <stop offset="0.35" stop-color="#ffd489" stop-opacity="0.55"/>
        <stop offset="0.68" stop-color="#f79a63" stop-opacity="0.16"/>
        <stop offset="1"   stop-color="#f4815a" stop-opacity="0"/>
      </radialGradient>
      <!-- 海面 -->
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#e9a271"/>
        <stop offset="0.16" stop-color="#b9726f"/>
        <stop offset="0.5" stop-color="#5c4368"/>
        <stop offset="1"   stop-color="#2b2a4e"/>
      </linearGradient>
      <!-- 公路 -->
      <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#3a2f4b"/>
        <stop offset="0.35" stop-color="#241d36"/>
        <stop offset="1"   stop-color="#120e20"/>
      </linearGradient>
      <!-- 鹈鹕身体（userSpaceOnUse：身体、脖子、头部共用同一光照渐变，避免拼缝） -->
      <linearGradient id="bodyG" gradientUnits="userSpaceOnUse" x1="706" y1="128" x2="428" y2="352">
        <stop offset="0"   stop-color="#fffdf6"/>
        <stop offset="0.5" stop-color="#f6e8d2"/>
        <stop offset="1"   stop-color="#dcc4a4"/>
      </linearGradient>
      <linearGradient id="wingG" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0"   stop-color="#fbf1e1"/>
        <stop offset="1"   stop-color="#d9c3a2"/>
      </linearGradient>
      <linearGradient id="wingFarG" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0"   stop-color="#e0c9a9"/>
        <stop offset="1"   stop-color="#bda487"/>
      </linearGradient>
      <!-- 喙（上下颌 + 喉囊共用一条渐变） -->
      <linearGradient id="billG" x1="0.1" y1="0" x2="0.5" y2="1">
        <stop offset="0"   stop-color="#ffdc96"/>
        <stop offset="0.42" stop-color="#f8ab53"/>
        <stop offset="0.78" stop-color="#ec8a3e"/>
        <stop offset="1"   stop-color="#d76a30"/>
      </linearGradient>
      <!-- 自行车 -->
      <linearGradient id="frameG" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0"   stop-color="#2a8f9c"/>
        <stop offset="0.5" stop-color="#17626f"/>
        <stop offset="1"   stop-color="#0e4551"/>
      </linearGradient>
      <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"   stop-color="#f6d79b"/>
        <stop offset="1"   stop-color="#b98a45"/>
      </linearGradient>
      <radialGradient id="hubG" cx="0.35" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#fbeec8"/>
        <stop offset="1" stop-color="#a8793a"/>
      </radialGradient>
      <!-- 颗粒 / 纸张质感 -->
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="7" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <radialGradient id="vignetteG" cx="0.5" cy="0.46" r="0.78">
        <stop offset="0.55" stop-color="#06040c" stop-opacity="0"/>
        <stop offset="1"   stop-color="#06040c" stop-opacity="0.55"/>
      </radialGradient>
      <clipPath id="sceneClip"><rect x="0" y="0" width="1200" height="675"/></clipPath>
    </defs>

    <g clip-path="url(#sceneClip)">

      <!-- ================= 天空 ================= -->
      <rect x="0" y="0" width="1200" height="675" fill="url(#skyG)"/>

      <!-- 星点 -->
      <g fill="#fff6e2" opacity="0.55">
        <circle cx="120" cy="58" r="1.5"/><circle cx="268" cy="34" r="1.1"/>
        <circle cx="404" cy="82" r="1.3"/><circle cx="520" cy="40" r="1"/>
        <circle cx="806" cy="52" r="1.4"/><circle cx="980" cy="96" r="1.1"/>
        <circle cx="1092" cy="44" r="1.5"/><circle cx="640" cy="18" r="1"/>
        <circle cx="184" cy="128" r="1"/><circle cx="352" cy="146" r="0.9"/>
      </g>

      <!-- 落日光晕 + 日轮 -->
      <circle cx="926" cy="404" r="196" fill="url(#sunGlow)"/>
      <circle cx="926" cy="404" r="54" fill="#fff3cd" opacity="0.96"/>
      <circle cx="926" cy="404" r="38" fill="#fffdf0"/>

      <!-- 云带 -->
      <g class="cloud-drift" opacity="0.55">
        <g fill="#f6c9a4">
          <ellipse cx="330" cy="196" rx="126" ry="15"/>
          <ellipse cx="392" cy="182" rx="74" ry="10"/>
          <ellipse cx="262" cy="206" rx="58" ry="8"/>
        </g>
        <g fill="#f0b494" opacity="0.8">
          <ellipse cx="812" cy="150" rx="104" ry="11"/>
          <ellipse cx="866" cy="138" rx="56" ry="7"/>
        </g>
        <g fill="#e8a893" opacity="0.6">
          <ellipse cx="586" cy="256" rx="150" ry="9"/>
          <ellipse cx="518" cy="266" rx="72" ry="6"/>
        </g>
        <g fill="#f3c2a6" opacity="0.75">
          <ellipse cx="1058" cy="296" rx="118" ry="10"/>
          <ellipse cx="1120" cy="284" rx="54" ry="6"/>
        </g>
      </g>

      <!-- 飞鸟 -->
      <g class="bird-fly" stroke="#2b1f3a" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7">
        <path d="M842 244 q9 -8 18 0 q9 -8 18 0"/>
        <path d="M902 214 q7 -6 14 0 q7 -6 14 0" stroke-width="2"/>
        <path d="M772 274 q6 -5 12 0 q6 -5 12 0" stroke-width="1.8"/>
      </g>

      <!-- ================= 远山与海 ================= -->
      <g opacity="0.85">
        <path d="M0 470 L0 402 q96 -54 178 -14 q34 16 66 30 q80 34 150 -6 q64 -36 132 -22 q60 12 108 44 q52 34 118 14 q58 -18 118 -6 q84 16 156 36 q78 22 154 8 L1200 470 Z"
              fill="#4b3557" opacity="0.85"/>
        <path d="M0 470 L0 436 q120 -40 226 -6 q68 22 132 6 q96 -24 186 8 q84 30 176 10 q86 -20 168 4 q92 26 180 12 q66 -10 132 6 L1200 470 Z"
              fill="#3a2a48"/>
      </g>

      <!-- 海面 -->
      <rect x="0" y="470" width="1200" height="96" fill="url(#seaG)"/>
      <!-- 海面反光 -->
      <g class="sun-shimmer" fill="#ffe2ab" opacity="0.55" style="transform-origin:926px 516px">
        <ellipse cx="926" cy="482" rx="86" ry="3.4"/>
        <ellipse cx="918" cy="496" rx="112" ry="3.8" opacity="0.85"/>
        <ellipse cx="934" cy="512" rx="72" ry="3.2" opacity="0.7"/>
        <ellipse cx="920" cy="528" rx="126" ry="4" opacity="0.5"/>
        <ellipse cx="936" cy="546" rx="88" ry="3.4" opacity="0.34"/>
        <ellipse cx="912" cy="562" rx="58" ry="2.8" opacity="0.22"/>
      </g>
      <!-- 远帆 -->
      <g fill="#2b1f3d" opacity="0.9">
        <path d="M1044 516 l34 0 q-2 7 -6 9 l-22 0 q-4 -2 -6 -9 Z"/>
        <path d="M1061 514 l0 -40 l22 38 Z"/>
        <path d="M1059 514 l0 -26 l-16 26 Z" opacity="0.8"/>
      </g>
      <!-- 远处的浪线 -->
      <g stroke="#f1b58c" stroke-width="1.6" stroke-linecap="round" opacity="0.28">
        <path d="M60 520 h74" /><path d="M212 534 h54" /><path d="M120 548 h96"/>
        <path d="M330 542 h60" /><path d="M1084 528 h68" /><path d="M1140 552 h50"/>
      </g>

      <!-- ================= 公路 ================= -->
      <rect x="0" y="560" width="1200" height="115" fill="url(#roadG)"/>
      <rect x="0" y="560" width="1200" height="3" fill="#f6cf9c" opacity="0.5"/>
      <line id="laneLine" x1="-60" y1="620" x2="1260" y2="620"
            stroke="#f7e7c5" stroke-width="6" stroke-dasharray="50 64" opacity="0.3"/>
      <g fill="#f6dcb4" opacity="0.13">
        <circle cx="180" cy="600" r="2.4"/><circle cx="420" cy="618" r="1.8"/>
        <circle cx="700" cy="596" r="2.2"/><circle cx="880" cy="648" r="2"/>
        <circle cx="1040" cy="606" r="1.6"/><circle cx="300" cy="662" r="2.2"/>
      </g>

      <!-- ================= 棕榈剪影（画框感） ================= -->
      <g fill="#170f26" opacity="0.94">
        <g class="palm-sway" style="transform-origin:96px 592px">
          <path d="M96 592 q-12 -96 6 -186 q4 -18 12 -20 q8 2 9 18 q7 92 -3 188 Z"/>
          <path d="M110 396 q38 -34 82 -30 q-34 12 -58 40 q-12 8 -24 -10 Z"/>
          <path d="M110 394 q30 -48 74 -58 q-28 26 -44 62 q-16 12 -30 -4 Z"/>
          <path d="M104 392 q-32 -40 -76 -44 q34 16 52 50 q14 10 24 -6 Z"/>
          <path d="M102 398 q-40 -14 -78 6 q38 -2 64 14 q16 2 14 -20 Z"/>
          <path d="M112 404 q44 -6 74 16 q-38 -8 -62 2 q-18 4 -12 -18 Z"/>
        </g>
        <g class="palm-sway" style="transform-origin:1136px 606px;animation-delay:-2.4s">
          <path d="M1136 606 q14 -84 2 -164 q-3 -18 -11 -19 q-8 3 -8 19 q-2 82 4 164 Z"/>
          <path d="M1124 442 q-34 -30 -74 -26 q30 10 52 36 q10 6 22 -10 Z"/>
          <path d="M1126 440 q-26 -44 -66 -52 q26 24 40 56 q14 10 26 -4 Z"/>
          <path d="M1132 438 q30 -36 70 -38 q-30 14 -48 44 q-12 10 -22 -6 Z"/>
          <path d="M1134 444 q36 -12 70 6 q-34 -2 -58 12 q-14 2 -12 -18 Z"/>
          <path d="M1122 448 q-38 -4 -64 16 q34 -8 54 2 q16 2 10 -18 Z"/>
        </g>
      </g>

      <!-- ================= 前景草（滚动） ================= -->
      <g id="grassTrack" opacity="0.92"></g>

      <!-- ================= 速度线与尘雾 ================= -->
      <g class="streak" stroke="#f9e2b8" stroke-linecap="round" fill="none">
        <path d="M356 344 h64" stroke-width="3" opacity="0.30"/>
        <path d="M300 396 h96" stroke-width="2.4" opacity="0.22"/>
        <path d="M340 470 h58" stroke-width="2" opacity="0.16"/>
      </g>
      <g class="dust" fill="#f0cfa4" opacity="0.24" style="transform-origin:372px 586px">
        <circle cx="372" cy="586" r="9"/>
        <circle cx="330" cy="578" r="6" opacity="0.7"/>
        <circle cx="292" cy="590" r="4" opacity="0.5"/>
      </g>

      <!-- 影子 -->
      <ellipse cx="612" cy="594" rx="212" ry="16" fill="#08050f" opacity="0.42"/>

      <!-- ================= 自行车 + 鹈鹕 ================= -->
      <!-- rigWrap 只做整体缩放（以接地点为轴），内部动画仍使用原始坐标 -->
      <g id="rigWrap" transform="translate(610 592) scale(0.93) translate(-610 -592)">
      <g id="rig">

        <!-- 车轮 -->
        <g id="wheelRear">
          <g id="spokesRear" stroke="#cfe0e4" stroke-width="2" opacity="0.5"></g>
          <circle cx="430" cy="474" r="118" fill="none" stroke="#221c30" stroke-width="13"/>
          <circle cx="430" cy="474" r="118" fill="none" stroke="#3d3450" stroke-width="4"/>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";

  /* 元素缓存：每帧只读属性，避免重复查询 DOM */
  var elements = Object.create(null);
  function q(id){
    var found = elements[id];
    if (found) return found;
    found = document.getElementById(id);
    if (!found) throw new Error("找不到 SVG 元素 #" + id);
    elements[id] = found;
    return found;
  }

  /* ——— 几何常量（与 SVG 坐标一致） ——— */
  var BB        = { x: 585, y: 522 };   // 中轴
  var CRANK_R   = 36;                   // 曲柄长
  var HIP       = { x: 520, y: 329 };   // 髋关节
  var THIGH     = 126;
  var SHIN      = 130;
  var REAR      = { x: 430, y: 474 };
  var FRONT     = { x: 790, y: 474 };
  var GEAR      = 0.42;                 // 车轮转 1 圈，曲柄转 0.42 圈
  var BASE_DEG  = 165;                  // 速度 1× 时车轮角速度（度/秒）
  /* 接地半径 = 外胎外沿(118 + 13/2) × rigWrap 的 0.93 缩放，保证轮子与路面不打滑 */
  var WHEEL_C   = 2 * Math.PI * 124.5 * 0.93;

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var speed = 1;
  var paused = reduceMotion;
  var wheelDeg = 0;      // 车轮累计角度（驱动轮辐/地面）
  var crankDeg = 0;      // 曲柄角度
  var groundX  = 0;      // 地面滚动累计位移
  var lastFrame = 0;
  var blinkClock = 0;

  /* ——— 生成轮辐 ——— */
  function buildSpokes(group, hub){
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 16; i++){
      var a = (i / 16) * Math.PI * 2;
      var line = document.createElementNS(NS, "line");
      line.setAttribute("x1", hub.x.toFixed(1));
      line.setAttribute("y1", hub.y.toFixed(1));
      line.setAttribute("x2", (hub.x + Math.cos(a) * 102).toFixed(1));
      line.setAttribute("y2", (hub.y + Math.sin(a) * 102).toFixed(1));
      line.setAttribute("stroke-width", i % 2 ? 1.4 : 2.4);
      frag.appendChild(line);
    }
    group.appendChild(frag);
  }
  buildSpokes(q("spokesRear"), REAR);
  buildSpokes(q("spokesFront"), FRONT);

  /* ——— 生成前景草丛（同一份草叶参数画两段，回绕时图案一致 → 真正无缝） ——— */
  (function buildGrass(){
    var seed = 20261104;
    function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    var track = q("grassTrack");
    var SPAN = 1200;
    var layers = [
      { color: "#201a38", base: 676, hMin: 10, hMax: 30, wMin: 1.8, wMax: 3.4, gapMin: 9, gapMax: 20, lean: 12 },
      { color: "#0c0818", base: 680, hMin: 24, hMax: 58, wMin: 2.6, wMax: 5,    gapMin: 14, gapMax: 32, lean: 26 }
    ];
    layers.forEach(function(layer){
      var tufts = [];
      var x = -30;
      while (x < SPAN + 30){
        tufts.push({
          x: x,
          h: layer.hMin + rnd() * (layer.hMax - layer.hMin),
          lean: (rnd() - 0.5) * layer.lean,
          w: layer.wMin + rnd() * (layer.wMax - layer.wMin)
        });
        x += layer.gapMin + rnd() * (layer.gapMax - layer.gapMin);
      }
      for (var copy = 0; copy < 2; copy++){
        var g = document.createElementNS(NS, "g");
        g.setAttribute("fill", "none");
        g.setAttribute("stroke", layer.color);
        g.setAttribute("stroke-linecap", "round");
        tufts.forEach(function(t){
          var X = t.x + copy * SPAN;
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d",
            "M" + X.toFixed(1) + "," + layer.base + " C" +
            (X + t.lean * 0.3).toFixed(1) + "," + (layer.base - t.h * 0.58).toFixed(1) + " " +
            (X + t.lean * 0.8).toFixed(1) + "," + (layer.base - t.h * 0.86).toFixed(1) + " " +
            (X + t.lean).toFixed(1) + "," + (layer.base - t.h).toFixed(1));
          p.setAttribute("stroke-width", t.w.toFixed(1));
          g.appendChild(p);
        });
        track.appendChild(g);
      }
    });
  })();

  /* ——— 两段式 IK：已知髋与踏板，求膝盖（膝盖朝前） ——— */
  function solveKnee(hip, foot){
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxReach = THIGH + SHIN - 1;
    if (d > maxReach){ dx *= maxReach / d; dy *= maxReach / d; d = maxReach; }
    d = Math.max(d, Math.abs(THIGH - SHIN) + 1);
    var phi  = Math.atan2(dy, dx);
    var cosB = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    var beta = Math.acos(Math.max(-1, Math.min(1, cosB)));
    var t = phi - beta;
    return { x: hip.x + Math.cos(t) * THIGH, y: hip.y + Math.sin(t) * THIGH };
  }

  function setPath(id, x1, y1, x2, y2){
    q(id).setAttribute("d",
      "M" + x1.toFixed(1) + "," + y1.toFixed(1) + " L" + x2.toFixed(1) + "," + y2.toFixed(1));
  }

  /* ——— 画一条腿 ——— */
  function drawLeg(prefix, pedal, hipYOffset, tilt){
    var hip   = { x: HIP.x, y: HIP.y + hipYOffset };
    var ankle = { x: pedal.x + 1.5, y: pedal.y - 2 };
    var knee  = solveKnee(hip, ankle);
    setPath(prefix + "ThighOut", hip.x, hip.y, knee.x, knee.y);
    setPath(prefix + "ThighIn",  hip.x, hip.y, knee.x, knee.y);
    setPath(prefix + "ShinOut",  knee.x, knee.y, ankle.x, ankle.y);
    setPath(prefix + "ShinIn",   knee.x, knee.y, ankle.x, ankle.y);
    var foot = q(prefix === "n" ? "footNear" : "footFar");
    var isNear = prefix === "n";
    foot.setAttribute("transform",
      "translate(" + ankle.x.toFixed(1) + "," + (ankle.y + 1).toFixed(1) + ") rotate(" +
      (tilt * (isNear ? 1 : 0.8)).toFixed(1) + ") scale(" + (isNear ? 1 : 0.92) + ")");
  }

  function pedalAt(deg){
    var a = deg * Math.PI / 180;
    return { x: BB.x + Math.cos(a) * CRANK_R, y: BB.y + Math.sin(a) * CRANK_R };
  }

  /* ——— 每帧渲染 ——— */
  function render(){
    /* 车轮 */
    q("spokesRear").setAttribute("transform",
      "rotate(" + wheelDeg.toFixed(2) + "," + REAR.x + "," + REAR.y + ")");
    q("spokesFront").setAttribute("transform",
      "rotate(" + wheelDeg.toFixed(2) + "," + FRONT.x + "," + FRONT.y + ")");

    /* 曲柄：链轮 + 两根曲柄臂整体旋转 */
    q("crankArms").setAttribute("transform",
      "rotate(" + crankDeg.toFixed(2) + "," + BB.x + "," + BB.y + ")");

    /* 两个踏板（保持水平，仅平移） */
    var nearPedalDeg = crankDeg;
    var farPedalDeg  = crankDeg + 180;
    var nearPedal = pedalAt(nearPedalDeg);
    var farPedal  = pedalAt(farPedalDeg);
    q("pedalNear").setAttribute("transform",
      "translate(" + nearPedal.x.toFixed(1) + "," + nearPedal.y.toFixed(1) + ")");
    q("pedalFar").setAttribute("transform",
      "translate(" + farPedal.x.toFixed(1) + "," + farPedal.y.toFixed(1) + ")");

    /* 身体的轻微起伏，腿跟随髋一起起伏 */
    var bob = Math.sin(nearPedalDeg * Math.PI / 180 * 2) * 2.6;
    q("rider").setAttribute("transform", "translate(0 " + bob.toFixed(2) + ") rotate(" +
      (Math.sin(nearPedalDeg * Math.PI / 180) * 0.9).toFixed(2) + " 528 322)");

    var tilt = Math.sin(nearPedalDeg * Math.PI / 180) * 7;
    drawLeg("n", nearPedal, bob, tilt);
    drawLeg("f", farPedal, bob, -tilt);

    /* 地面滚动 */
    q("laneLine").setAttribute("stroke-dashoffset", (groundX * -1).toFixed(1));
    var grassOffset = groundX * 1.35 % 1200;
    q("grassTrack").setAttribute("transform", "translate(" + (-grassOffset).toFixed(1) + ",0)");

    /* 眨眼（时间驱动，与帧率无关） */
    var blinkPhase = blinkClock % 4.2;
    var lid = 0;
    if (blinkPhase > 3.96 && blinkPhase < 4.26){
      lid = 1 - Math.abs(blinkPhase - 4.11) / 0.15;
    }
    q("eyeLid").setAttribute("ry", (0.5 + Math.max(0, lid) * 10).toFixed(2));
  }

  /* ——— 主循环：只有「播放中 且 页面可见」时才注册 rAF，避免空转耗电 ——— */
  var rafId = 0;
  var onScreen = true;

  function frame(now){
    rafId = 0;
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    var deg = BASE_DEG * speed * dt;
    wheelDeg += deg;
    crankDeg += deg * GEAR;
    groundX  += (deg / 360) * WHEEL_C;
    blinkClock += dt * Math.max(0.6, speed);
    if (wheelDeg > 1e6) wheelDeg %= 360;
    if (crankDeg > 1e6) crankDeg %= 360;
    /* 取模值取路面虚线周期（50+64=114）的整数倍，久跑不会跳相位 */
    if (groundX  > 1e6) groundX  %= 114 * 600;

    render();
    rafId = window.requestAnimationFrame(frame);
  }

  function start(){
    if (!rafId){
      lastFrame = 0;
      rafId = window.requestAnimationFrame(frame);
    }
  }
  function stop(){
    if (rafId){
      window.cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }
  function sync(){
    if (!paused && onScreen && !document.hidden) start();
    else stop();
  }

  /* ——— 装饰元素的播放节奏随速度缩放（CSS 变量 --spd 驱动） ——— */
  function syncDecorSpeed(){
    document.documentElement.style.setProperty("--spd", Math.max(0.4, speed).toFixed(2));
  }

  /* ——— 交互 ——— */
  var toggleBtn = q("toggle");
  var speedInput = q("speed");
  var speedOut = q("speedOut");
  var DECOR = ".cloud-drift,.sun-shimmer,.scarf,.palm-sway,.bird-fly,.dust,.streak";

  function setPaused(v){
    paused = v;
    toggleBtn.classList.toggle("is-paused", v);
    toggleBtn.setAttribute("aria-label", v ? "播放动画" : "暂停动画");
    toggleBtn.setAttribute("aria-pressed", v ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll(DECOR), function(node){
      node.style.animationPlayState = v ? "paused" : "running";
    });
    sync();
  }

  toggleBtn.addEventListener("click", function(){ setPaused(!paused); });

  document.addEventListener("keydown", function(e){
    if (e.code === "Space" && !/input|button|textarea/i.test(e.target.tagName)){
      e.preventDefault();
      setPaused(!paused);
    }
  });

  speedInput.addEventListener("input", function(){
    speed = parseFloat(speedInput.value) || 1;
    speedOut.textContent = speed.toFixed(1) + "×";
    syncDecorSpeed();
  });

  document.addEventListener("visibilitychange", sync);
  if ("IntersectionObserver" in window){
    new IntersectionObserver(function(entries){
      onScreen = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 }).observe(document.querySelector(".poster"));
  }

  setPaused(paused);
  syncDecorSpeed();
  render();
  sync();
})();
</script>
</body>
</html>
